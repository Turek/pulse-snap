name: pulse_snap
description: "PulseSnap — snap a BP monitor, get a reading."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # OCR & Vision
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.11.0
  image_picker: ^1.1.0
  image: ^4.2.0

  # State Management & Navigation
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^14.0.0

  # Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Charts
  fl_chart: ^1.1.1

  # Calendar
  table_calendar: ^3.2.0

  # Networking (Phase 2 stub uses it)
  dio: ^5.7.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  dynamic_color: ^1.7.0
  flutter_tesseract_ocr: ^0.4.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - vendor/display_ocr/letsgodigital/letsgodigital.traineddata
